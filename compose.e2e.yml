services:
  app:
    build: .
    command: ["--db-url", "mongodb://mongo:27017/assocomptes_e2e", "--keycloak-ui", "/fixtures/keycloak-ui.json", "--keycloak-backend", "/fixtures/keycloak-backend.json"]
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./e2e/fixtures:/fixtures:ro
    depends_on:
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/keycloak.json').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 2s
      timeout: 5s
      retries: 20

  mongo:
    image: ${E2E_MONGO_IMAGE:-mongo:8.3.17}
    ports:
      - "127.0.0.1:27028:27017"
    healthcheck:
      test: ["CMD-SHELL", "if command -v mongosh >/dev/null; then shell=mongosh; else shell=mongo; fi; $$shell --quiet --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'"]
      interval: 2s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:10.0.2
    command: ["-b", "0.0.0.0", "-Djboss.http.port=18081"]
    environment:
      DB_VENDOR: h2
      KEYCLOAK_FRONTEND_URL: http://keycloak.localhost:18081/auth
      KEYCLOAK_IMPORT: /fixtures/keycloak-realm.json
    ports:
      - "127.0.0.1:18081:18081"
    volumes:
      - ./e2e/fixtures:/fixtures:ro
    networks:
      default:
        aliases:
          - keycloak.localhost
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18081/auth/realms/assocomptes/.well-known/openid-configuration"]
      interval: 3s
      timeout: 5s
      retries: 40
