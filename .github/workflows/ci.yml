name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: assocomptes-e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sh preinstall.sh && npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f compose.e2e.yml up --build --wait --wait-timeout 180
      - run: npm run test:e2e
      - name: Show Compose logs
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
      - if: always()
        run: docker compose -f compose.e2e.yml down --volumes

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build . -t davdiv/assocomptes:latest
      - name: Publish to dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username davdiv --password-stdin
          docker push davdiv/assocomptes:latest
          docker logout
