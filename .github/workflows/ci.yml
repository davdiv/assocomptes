name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: assocomptes-e2e
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sh preinstall.sh && npm ci
      - run: google-chrome --version
      - run: docker compose -f compose.e2e.yml up --build --wait --wait-timeout 180
      - run: npm run test:e2e
      - name: Show Compose logs
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color
      - if: always()
        run: docker compose -f compose.e2e.yml down --volumes
